packages:
  - "packages/*"

allowBuilds:
  "@scarf/scarf": false
  esbuild: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

minimumReleaseAgeExclude:
  - "@tanstack/query-async-storage-persister@5.105.2"
  - "@tanstack/query-core@5.105.2"
  - "@tanstack/query-devtools@5.105.2"
  - "@tanstack/query-persist-client-core@5.105.2"
  - "@tanstack/react-query-devtools@5.105.2"
  - "@tanstack/react-query-persist-client@5.105.2"
  - "@tanstack/react-query@5.105.2"
  - "@vitejs/plugin-react@6.2.1"
  - cn@0.5.2
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
